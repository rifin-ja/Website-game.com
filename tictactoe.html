<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
:root{--bg:#060a14;--panel:#0c1326;--line:#25337a;--acc:#4ee2c8;--dark:#04201c;--tx:#e8f5f3;--mu:#8fa0c8;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px}
button,input{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:440px}
.info{color:var(--mu);font-size:14px}.info b{color:var(--tx)}
.hint{color:var(--mu);font-size:12px;text-align:center}
.mini{background:var(--acc);border:0;color:var(--dark);padding:10px 18px;border-radius:10px;font-weight:700}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:140px;text-align:center;font-size:18px}
.dpad{display:grid;gap:6px;justify-items:center}
.dpad div{display:flex;gap:6px}
.dpad button{width:54px;height:46px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.tt{display:grid;grid-template-columns:repeat(3,84px);gap:8px}
.tt button,.mm button{background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:34px}
.tt button{height:84px}
.mm{display:grid;grid-template-columns:repeat(4,66px);gap:8px}
.mm button{height:66px;font-size:30px;color:var(--mu)}
.mm button.on{background:var(--acc);color:var(--dark);border-color:var(--acc)}
.mm button.ok{background:rgba(45,212,191,.18);border-color:var(--acc);color:var(--tx)}
canvas{width:100%;max-width:300px;border-radius:12px;border:1px solid var(--line);touch-action:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
function tictactoe(el){
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let b,sk={X:0,O:0,S:0},usai,tm;
  const menang=b=>{for(const[a,c,d]of L)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.includes('')?null:'S'};
  function mm(b,p){const w=menang(b);if(w)return w=='O'?1:w=='X'?-1:0;
    let r=p=='O'?-2:2;
    b.forEach((v,i)=>{if(!v){b[i]=p;const n=mm(b,p=='O'?'X':'O');b[i]='';r=p=='O'?Math.max(r,n):Math.min(r,n)}});return r}
  function komputer(){
    const k=b.map((v,i)=>v?-1:i).filter(i=>i>=0);let pilih=k[Math.random()*k.length|0];
    if(Math.random()>.3){let top=-2;k.forEach(i=>{b[i]='O';const n=mm(b,'X');b[i]='';if(n>top){top=n;pilih=i}})}
    b[pilih]='O';selesai();draw()}
  function selesai(){const w=menang(b);if(w){usai=w;sk[w]++}}
  function reset(){b=Array(9).fill('');usai=null;draw()}
  function draw(){
    const st=usai=='X'?'Kamu menang! 🎉':usai=='O'?'Komputer menang':usai=='S'?'Seri':'Giliranmu (X)';
    el.innerHTML=`<p class="info">Kamu <b>${sk.X}</b> &nbsp; Seri <b>${sk.S}</b> &nbsp; Komputer <b>${sk.O}</b></p>
    <div class="tt">${b.map((v,i)=>`<button data-i="${i}" aria-label="Kotak ${i+1}">${v}</button>`).join('')}</div>
    <p class="info"><b>${st}</b></p><button class="mini">${usai?'Main lagi':'Ulang'}</button>`;
    el.querySelectorAll('.tt button').forEach(x=>x.onclick=()=>{
      const i=+x.dataset.i;if(usai||b[i])return;b[i]='X';selesai();draw();
      if(!usai)tm=setTimeout(komputer,350)});
    el.querySelector('.mini').onclick=reset}
  reset();
  return()=>clearTimeout(tm);
}

tictactoe(document.getElementById('app'));
</script>
</body>
</html>
