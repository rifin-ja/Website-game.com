function tex(w,h,fn,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=aniso;return t}
const M=(c,r=.9,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

// ===== LANGIT, MATAHARI, AWAN, GUNUNG =====
const skyTex=tex(512,256,(g,w,h)=>{const q=g.createLinearGradient(0,0,0,h);q.addColorStop(0,'#2a78cc');q.addColorStop(.3,'#68b0ea');q.addColorStop(.5,'#d6ecf4');q.addColorStop(1,'#d6ecf4');g.fillStyle=q;g.fillRect(0,0,w,h)});

for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(R(70,120),R(60,110),6),new THREE.MeshBasicMaterial({color:i%2?0x86a9b8:0x9bbac6,fog:false}));m.position.set(-420+i*105+R(-20,20),20,-540);m.rotation.y=R(0,3);scene.add(m);mtns.push(m.material);m.material.userData.base=m.material.color.clone()}

const grassTex=tex(256,256,(g,w,h)=>{g.fillStyle='#5f9440';g.fillRect(0,0,w,h);for(let i=0;i<2600;i++){g.fillStyle=`hsla(${R(85,115)},${R(35,55)}%,${R(22,45)}%,.5)`;g.fillRect(R(0,w),R(0,h),R(1,2),R(2,6))}},80,70);

 g.fillStyle='#eee';[-6.5,6.5].forEach(x=>g.fillRect(X(x)-3,0,7,h));g.fillStyle='#f3c52b';[-.15,.15].forEach(x=>g.fillRect(X(x)-2,0,4,h));

for(const x of[-7.9,7.9]){const s=new THREE.Mesh(new THREE.PlaneGeometry(1.8,600),M(0x9c8a66));s.rotation.x=-Math.PI/2;s.position.set(x,.01,-250);s.receiveShadow=true;scene.add(s)}

 const g=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:true,bevelSize:bev,bevelThickness:bev,bevelSegments:3,curveSegments:10});g.translate(0,0,-depth/2);return g}
function makeCar(color,o={}){
 const{cheap=0,L=2.05,W=1.7,B=1,N=.95,R=1.68,cb=-1.25,rr=-.7,rf=.35,cf=1.25,gb=.35,wr=.42,ww=.3,wz=[-1.25,1.3],wing=0,intake=0,split=0}=o;

 const add=(geo,m,x,y,z,ry=0)=>{const q=new THREE.Mesh(geo,m);q.position.set(x,y,z);q.rotation.y=ry;q.castShadow=true;car.add(q);return q},hwid=(W+.24)/2;

 if(wing){add(new THREE.BoxGeometry(W+.2,.05,.5),bm,0,R+.2,L-.4);for(const x of[-.5,.5])add(new THREE.BoxGeometry(.06,.3,.2),bm,x,R+.04,L-.4)}
 if(intake)for(const x of[-1,1])add(new THREE.BoxGeometry(.05,.22,.7),tireM,x*(hwid+.02),B-.28,.55);
 if(split)add(new THREE.BoxGeometry(W+.2,.04,.4),tireM,0,gb+.03,-(L+.25));
 const wheels=[];for(const x of[-hwid,hwid])for(const z of wz){const w=wheel(wr,ww);w.position.set(x,wr,z);car.add(w);wheels.push(w.spin)}
 const hx=W*.38,heads=[],tails=[];
 for(const x of[-hx,hx]){const hm=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff2c0,emissiveIntensity:2});add(new THREE.BoxGeometry(W*.3,.16,.08),hm,x,N-.15,-(L+.17));heads.push(hm)}
 const sig=[[],[]];[[-1,0],[1,1]].forEach(([sx,i])=>[-(L+.12),L+.12].forEach(z=>{const sm=new THREE.MeshStandardMaterial({color:0x553300,emissive:0xff9900,emissiveIntensity:0});add(new THREE.BoxGeometry(.22,.14,.08),sm,sx*hwid*.93,N-.17,z);sig[i].push(sm)}));
 for(const x of[-hx,hx]){const m=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff1010,emissiveIntensity:1});add(new THREE.BoxGeometry(W*.3,.16,.08),m,x,B-.15,L+.17);tails.push(m)}
 if(cheap)car.children.forEach((c,i)=>c.castShadow=i<3);

 const P={sport:{r:.33,rz:.9,fz:-.85,sy:.95,ty:1.35,tl:-.5,hy:1.75,fh:.85,ww:.2,hw:.5},bebek:{r:.27,rz:.75,fz:-.7,sy:.82,ty:1.2,tl:-.15,hy:1.6,fh:.72,ww:.12,hw:.42},matic:{r:.26,rz:.72,fz:-.68,sy:.8,ty:1.18,tl:-.05,hy:1.58,fh:.7,ww:.14,hw:.42},trail:{r:.38,rz:.95,fz:-.95,sy:1.08,ty:1.5,tl:-.2,hy:1.9,fh:1.05,ww:.14,hw:.5}}[type];
 const b=new THREE.Group(),bm=new THREE.MeshPhysicalMaterial({color,metalness:.5,roughness:.3,clearcoat:1,envMap:envTex}),dk=M(0x15171a,.6,.3),jk=M(0x1d2a44,.8),wt_=M(0xf2f2f2,.3);
 const add=(g,m,x,y,z,par)=>{const q=new THREE.Mesh(g,m);q.position.set(x,y,z);q.castShadow=true;(par||b).add(q);return q},bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d),pipe=(x,y,z,l)=>add(new THREE.CylinderGeometry(.05,.065,l,10).rotateX(Math.PI/2),rimM,x,y,z);

 const sig=[[],[]];[[-1,0],[1,1]].forEach(([sx,i])=>[[.36,P.r+P.fh*.6+.1,P.fz+.15],[.16,P.sy+.03,P.rz+.35]].forEach(([x,y,z])=>{const sm=new THREE.MeshStandardMaterial({color:0x553300,emissive:0xff9900,emissiveIntensity:0});add(bx(.1,.08,.08),sm,sx*x,y,z);sig[i].push(sm)}));

let player;

// ===== PEMANDANGAN (bergulir) =====
const scenery=[],LEN=330;

 if(!running){const a=t*.45,rd=V.hl*2+4;camera.position.set(px+Math.sin(a)*rd,2.4,8+Math.cos(a)*rd);camera.lookAt(px,.9,8);camera.fov=lerp(camera.fov,50,.1)}
 else{
  if(view==0){camera.position.set(px*.6+R(-.2,.2)*shake+offroad*R(-.05,.05),6.2+R(-.12,.12)*shake,16.5);camera.lookAt(px*.3,1.4,-16)}
  else{const cy=view==1?V.eye:.55,cz=view==1?8.1:8-V.hl+.35,co=view==1&&!V.bike?.4:0;camera.position.set(px+co+R(-.04,.04)*shake+offroad*R(-.02,.02),cy+R(-.03,.03)*shake+offroad*R(-.02,.02),cz);camera.lookAt(px+co+Math.sin(psi)*30,cy-.1,cz-30*Math.cos(psi))}
  camera.fov=lerp(camera.fov,(view==1?70:58)+speed*.03,.08)}
 camera.updateProjectionMatrix();
 if(running&&fc%2==0)drawDash();if(fc%3==0)sndUpdate();renderer.render(scene,camera)}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(pr);renderer.setSize(innerWidth,innerHeight)});
</script>
